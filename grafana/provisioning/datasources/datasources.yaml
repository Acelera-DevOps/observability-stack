apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus-uid
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo-uid
          urlDisplayLabel: "Inspect Trace in Tempo"

  - name: Tempo
    type: tempo
    uid: tempo-uid
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki-uid
        spanStartTimeShift: "-5m"
        spanEndTimeShift: "5m"
        filterByTraceID: true
        filterBySpanID: false
        customQuery: true
        query: '{service_name="$${__span.tags[\"service.name\"]}"} | trace_id="$${__trace.traceId}"'
      tracesToMetrics:
        datasourceUid: prometheus-uid
        spanStartTimeShift: "-15m"
        spanEndTimeShift: "15m"
        tags:
          - key: service.name
            value: service_name
        queries:
          - name: "Request Rate (RPS)"
            query: 'sum(rate(http_server_requests_seconds_count{$$__tags}[5m]))'
          - name: "P99 Latency"
            query: 'histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{$$__tags}[5m])))'
      serviceMap:
        datasourceUid: prometheus-uid
      nodeGraph:
        enabled: true

  - name: Loki
    type: loki
    uid: loki-uid
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - datasourceUid: tempo-uid
          matcherRegex: "(?:trace_id|traceId)=([a-fA-F0-9]{16,32})"
          name: TraceID
          url: "$${__value.raw}"
          urlDisplayLabel: "Open Trace in Tempo"
